<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community Event Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0f1624;--page:#0f1624;--surface:#182136;--ink:#e8edf5;--muted:#9aa7bd;--line:#2b3750;--accent:#f2a93b;--accent-ink:#14213d;--today:#f2a93b;
--meeting:#6b9bff;--health:#f07a8a;--sports:#4cc2b2;--culture:#f2a93b;--learning:#a78bfa;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--page:#0f1624;--surface:#182136;--ink:#e8edf5;--muted:#9aa7bd;--line:#2b3750;--accent:#f2a93b;--accent-ink:#14213d;--meeting:#6b9bff;--health:#f07a8a;--sports:#4cc2b2;--culture:#f2a93b;--learning:#a78bfa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1624;--page:#0f1624;--surface:#182136;--ink:#e8edf5;--muted:#9aa7bd;--line:#2b3750;--accent:#f2a93b;--accent-ink:#14213d;--meeting:#6b9bff;--health:#f07a8a;--sports:#4cc2b2;--culture:#f2a93b;--learning:#a78bfa;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.bar h2{margin:0;font-size:1.4rem;font-weight:600}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:focus-visible,.chip:focus-visible,.day:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--today);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.8rem;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1/1;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;padding:4px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}
.day.out{opacity:.4}
.day.today .n{background:var(--today);color:#14213d;border-radius:6px;padding:0 6px;font-weight:800}
.day.sel{border:2.5px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
h3{margin:0 0 10px;font-size:1.15rem}
.ev{border-left:5px solid var(--c);background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.ev b{display:block}
.ev small{color:var(--muted)}
.ev button{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;align-self:flex-start}
.empty{color:var(--muted);margin:0 0 12px}
form{display:grid;gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
label{display:grid;gap:3px;font-size:.85rem;color:var(--muted)}
input,select{font:inherit;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.up{margin-top:18px}
.up li{list-style:none}
.up ul{padding:0;margin:0}
.pill{font-weight:800;min-width:3.2rem;display:inline-block}
</style>
</head>
<body>
<main>
<h1>Community event calendar</h1>
<p class="sub">Tap a date to see what’s happening, or add a new event.</p>
<div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
<div class="layout">
  <section class="card cal" aria-label="Month calendar">
    <div class="bar">
      <button class="btn" id="prev" aria-label="Previous month">‹</button>
      <h2 id="title"></h2>
      <div><button class="btn" id="today">Today</button> <button class="btn" id="next" aria-label="Next month">›</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
  <aside>
    <section class="card" aria-live="polite">
      <h3 id="selTitle"></h3>
      <div id="dayList"></div>
      <form id="form">
        <label>Event name<input id="fTitle" required maxlength="60"></label>
        <div class="row">
          <label>Date<input id="fDate" type="date" required></label>
          <label>Time<input id="fTime" type="time"></label>
        </div>
        <div class="row">
          <label>Category<select id="fCat"></select></label>
          <label>Place<input id="fPlace" maxlength="50"></label>
        </div>
        <button class="btn primary" type="submit">Add event</button>
      </form>
    </section>
    <section class="card up"><h3>Coming up</h3><ul id="upcoming"></ul></section>
  </aside>
</div>
</main>
<script>
(function(){
var CATS={meeting:["Meeting","--meeting"],health:["Health","--health"],sports:["Sports","--sports"],culture:["Culture","--culture"],learning:["Learning","--learning"]};
var KEY="community-calendar-events";
var seed=[
{id:"s1",title:"Barangay assembly",date:"2026-10-31",time:"09:00",cat:"meeting",place:"Barangay hall"},
{id:"s2",title:"Community clean-up drive",date:"2026-11-07",time:"06:30",cat:"health",place:"Main street"},
{id:"s3",title:"Inter-purok basketball",date:"2026-11-08",time:"15:00",cat:"sports",place:"Covered court"},
{id:"s4",title:"Free blood pressure check",date:"2026-11-12",time:"08:00",cat:"health",place:"Health center"},
{id:"s5",title:"Livelihood skills workshop",date:"2026-11-14",time:"13:00",cat:"learning",place:"Multipurpose hall"},
{id:"s6",title:"Cultural night",date:"2026-11-20",time:"18:00",cat:"culture",place:"Town plaza"},
{id:"s7",title:"Youth council meeting",date:"2026-11-22",time:"16:00",cat:"meeting",place:"Barangay hall"}];
var events=load(),filter="all",view=new Date(),sel=iso(new Date());
view.setDate(1);
function load(){try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(Array.isArray(p))return p}}catch(e){}return seed.slice()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(events))}catch(e){}}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function vis(){return events.filter(function(e){return filter==="all"||e.cat===filter}).sort(function(a,b){return (a.date+(a.time||"")).localeCompare(b.date+(b.time||""))})}
function fmtTime(t){if(!t)return "All day";var p=t.split(":"),h=+p[0];return ((h%12)||12)+":"+p[1]+(h<12?" AM":" PM")}
function color(c){return "var("+CATS[c][1]+")"}
var $=function(i){return document.getElementById(i)};

function filters(){
  var f=$("filters");f.innerHTML="";
  var all=[["all","All events",null]].concat(Object.keys(CATS).map(function(k){return [k,CATS[k][0],color(k)]}));
  all.forEach(function(x){
    var b=el("button","chip");b.type="button";b.setAttribute("aria-pressed",filter===x[0]);
    if(x[2]){var i=el("i");i.style.setProperty("--c",x[2]);b.appendChild(i)}
    b.appendChild(document.createTextNode(x[1]));
    b.onclick=function(){filter=x[0];render()};f.appendChild(b)});
}
function grid(){
  var g=$("grid");g.innerHTML="";
  $("title").textContent=view.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(function(d){g.appendChild(el("div","dow",d))});
  var start=new Date(view);start.setDate(1-view.getDay());
  var ev=vis(),today=iso(new Date());
  for(var i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);
    var b=el("button","day"+(d.getMonth()!==view.getMonth()?" out":"")+(k===today?" today":"")+(k===sel?" sel":""));
    b.type="button";
    var list=ev.filter(function(e){return e.date===k});
    b.setAttribute("aria-label",d.toDateString()+", "+list.length+" events");
    b.appendChild(el("span","n",d.getDate()));
    var dots=el("span","dots");
    list.slice(0,4).forEach(function(e){var s=el("i");s.style.setProperty("--c",color(e.cat));dots.appendChild(s)});
    b.appendChild(dots);
    b.onclick=function(){sel=k;$("fDate").value=k;render()};
    g.appendChild(b);
  }
}
function evRow(e,del){
  var r=el("div","ev");r.style.setProperty("--c",color(e.cat));
  var t=el("div");t.appendChild(el("b",null,e.title));
  t.appendChild(el("small",null,fmtTime(e.time)+(e.place?" at "+e.place:"")+" · "+CATS[e.cat][0]));
  r.appendChild(t);
  if(del){var x=el("button",null,"Remove");x.type="button";x.setAttribute("aria-label","Remove "+e.title);
    x.onclick=function(){events=events.filter(function(y){return y.id!==e.id});save();render()};r.appendChild(x)}
  return r;
}
function side(){
  var d=new Date(sel+"T00:00:00");
  $("selTitle").textContent=d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  var l=$("dayList");l.innerHTML="";
  var list=vis().filter(function(e){return e.date===sel});
  if(!list.length)l.appendChild(el("p","empty","Nothing scheduled. Add an event below."));
  list.forEach(function(e){l.appendChild(evRow(e,true))});
  var u=$("upcoming");u.innerHTML="";
  var up=vis().filter(function(e){return e.date>=iso(new Date())}).slice(0,5);
  if(!up.length)u.appendChild(el("li","empty","No upcoming events."));
  up.forEach(function(e){
    var li=el("li");var dd=new Date(e.date+"T00:00:00");
    li.appendChild(el("span","pill",dd.toLocaleDateString("en-US",{month:"short",day:"numeric"})));
    li.appendChild(document.createTextNode(e.title));u.appendChild(li)});
}
function render(){filters();grid();side()}
$("prev").onclick=function(){view.setMonth(view.getMonth()-1);render()};
$("next").onclick=function(){view.setMonth(view.getMonth()+1);render()};
$("today").onclick=function(){view=new Date();view.setDate(1);sel=iso(new Date());$("fDate").value=sel;render()};
Object.keys(CATS).forEach(function(k){var o=el("option",null,CATS[k][0]);o.value=k;$("fCat").appendChild(o)});
$("fDate").value=sel;
$("form").onsubmit=function(ev){
  ev.preventDefault();
  var e={id:"e"+Date.now(),title:$("fTitle").value.trim(),date:$("fDate").value,time:$("fTime").value,cat:$("fCat").value,place:$("fPlace").value.trim()};
  if(!e.title||!e.date)return;
  events.push(e);save();sel=e.date;view=new Date(e.date+"T00:00:00");view.setDate(1);
  $("fTitle").value="";$("fPlace").value="";$("fTime").value="";render();
};
render();
})();
</script>
</body>
</html>
